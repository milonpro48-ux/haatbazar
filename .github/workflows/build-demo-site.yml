name: Build HaatBazar demo site

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/build-demo-site.yml"

permissions:
  contents: read

jobs:
  build-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build static demo catalog
        run: npm run build
        env:
          VITE_DEMO_MODE: "true"
      - name: Upload static demo files
        uses: actions/upload-artifact@v4
        with:
          name: haatbazar-static-demo
          path: dist/
          if-no-files-found: error
          retention-days: 7
